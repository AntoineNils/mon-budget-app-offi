<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1e1e2e">
    <title>Budget Pro Dark</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Budget">

    <link rel="apple-touch-icon" href="./logo_carre.jpg">
    <link rel="manifest" href="manifest.json">

    <style>
        /* --- DESIGN DARK MODE PRO --- */
        :root {
            --bg-main: #1e1e2e; --bg-card: #2d2d3a; --text-primary: #ffffff; --text-secondary: #a0a0b0;
            --accent-grad: linear-gradient(135deg, #00cec9, #6c5ce7); --green: #00b894; --red: #ff7675; --input-bg: #383848;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg-main); color: var(--text-primary); margin: 0; padding: 0; 
            padding-bottom: 90px; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
        }
        h2, h3 { font-weight: 700; letter-spacing: 0.5px; }

        /* --- NAVIGATION --- */
        .navbar {
            position: fixed; bottom: 0; left: 0; width: 100%; background: var(--bg-card);
            box-shadow: 0 -5px 20px rgba(0,0,0,0.2); display: flex; justify-content: space-around;
            padding: 12px 0; z-index: 1000; padding-bottom: env(safe-area-inset-bottom);
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .nav-item {
            border: none; background: none; display: flex; flex-direction: column; align-items: center;
            color: var(--text-secondary); font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .nav-item span { font-size: 1.6rem; margin-bottom: 4px; }
        .nav-item.active { color: #6c5ce7; }
        .nav-item.active span { background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* --- UI ELEMENTS --- */
        .page { display: none; padding: 20px; padding-top: env(safe-area-inset-top); animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .month-selector-container { padding: 15px; background: var(--bg-main); text-align: center; margin-top: 20px; }
        .month-select { padding: 10px 20px; border-radius: 30px; background: var(--bg-card); color: var(--text-primary); border: 1px solid #6c5ce7; font-weight: bold; }

        .card-hero { background: var(--accent-grad); padding: 30px; border-radius: 24px; text-align: center; box-shadow: 0 10px 30px rgba(108, 92, 231, 0.3); margin-bottom: 25px; }
        .big-amount { font-size: 3rem; font-weight: 800; margin: 10px 0; }
        
        .kpi-row { display: flex; gap: 15px; margin-bottom: 30px; }
        .kpi { flex: 1; background: var(--bg-card); padding: 20px; border-radius: 20px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .kpi-val { font-size: 1.4rem; font-weight: 800; margin-top: 5px; }
        .green { color: var(--green); } .red { color: var(--red); }

        .trans-list { list-style: none; padding: 0; padding-bottom: 20px; }
        .trans-item {
            background: var(--bg-card); border-radius: 18px; padding: 15px 20px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center; position: relative; overflow: hidden;
        }
        .trans-item::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 5px; }
        .trans-item.type-income::before { background-color: var(--green); }
        .trans-item.type-expense::before { background-color: var(--red); }
        
        .trans-desc { font-weight: 700; font-size: 1.05rem; }
        .trans-meta { font-size: 0.85rem; color: var(--text-secondary); }
        .trans-amount { font-weight: 800; font-size: 1.1rem; }

        /* --- INPUTS --- */
        label { display: block; margin-bottom: 10px; font-weight: 700; margin-left: 5px; }
        input, select { width: 100%; padding: 16px; margin-bottom: 20px; border: none; border-radius: 16px; background: var(--input-bg); color: var(--text-primary); font-size: 1rem; font-weight: 600; outline: none; }
        button.btn-main { width: 100%; padding: 18px; background: var(--accent-grad); color: white; border: none; border-radius: 16px; font-size: 1.2rem; font-weight: 800; }
        
        /* --- CHARTS --- */
        .chart-container { background: var(--bg-card); padding: 30px; border-radius: 24px; text-align: center; }
        .pie-chart { width: 180px; height: 180px; border-radius: 50%; background: var(--input-bg); margin: 0 auto; border: 5px solid var(--bg-card); }
        .btn-option { width: 100%; padding: 20px; background: var(--bg-card); color: var(--text-primary); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; font-size: 1rem; font-weight: 700; margin-bottom: 15px; text-align: left; }
    </style>
</head>
<body>

    <div class="month-selector-container" id="monthSelCont">
        <select id="monthSelector" class="month-select" onchange="updateUI()"></select>
    </div>

    <div id="page-home" class="page active">
        <div class="card-hero"><small>Solde du mois</small><div id="displayBalance" class="big-amount">0.00 €</div></div>
        <div class="kpi-row">
            <div class="kpi"><small>📈 Entrées</small><div id="displayIncome" class="kpi-val green">+0 €</div></div>
            <div class="kpi"><small>📉 Sorties</small><div id="displayExpense" class="kpi-val red">-0 €</div></div>
        </div>
        <h3>Historique</h3>
        <div id="emptyMsg" style="text-align: center; color: var(--text-secondary); margin-top: 30px; display: none;">Rien à signaler.</div>
        <ul id="list" class="trans-list"></ul>
    </div>

    <div id="page-add" class="page">
        <h2 style="text-align:center;">Nouvelle Opération</h2>
        <label>C'est quoi ?</label><input type="text" id="inputDesc" placeholder="Ex: Courses...">
        <label>Combien ? (€)</label><input type="number" id="inputAmount" placeholder="0.00" step="0.01">
        <label>Catégorie</label>
        <select id="inputCat">
            <option value="Alimentation">🍔 Alimentation</option>
            <option value="Loyer">🏠 Loyer / Factures</option>
            <option value="Loisirs">🎉 Loisirs / Sorties</option>
            <option value="Transport">🚌 Transport</option>
            <option value="Shopping">🛍️ Shopping</option>
            <option value="Scolarité">📚 Scolarité</option>
            <option value="Parents">👪 Parents (Revenu)</option>
            <option value="Intérim">💼 Intérim (Revenu)</option>
            <option value="Ventes">📦 Ventes (Revenu)</option>
            <option value="Autre">🔄 Autre</option>
        </select>
        <label>Type</label>
        <select id="inputType"><option value="expense">💸 Dépense (-)</option><option value="income">💰 Revenu (+)</option></select>
        <label>Date</label><input type="date" id="inputDate">
        <button class="btn-main" onclick="addTransaction()">VALIDER</button>
    </div>

    <div id="page-stats" class="page">
        <h2 style="text-align:center;">Répartition</h2>
        <div class="chart-container"><div id="chart" class="pie-chart"></div><div id="legend" style="margin-top:30px; text-align: left;"></div></div>
    </div>

    <div id="page-settings" class="page">
        <h2 style="text-align:center;">Réglages</h2>
        <button class="btn-option" onclick="exportCSV()">📊 Exporter Excel</button>
        <button class="btn-option" onclick="downloadBackup()">💾 Sauvegarder</button>
        <button class="btn-option" onclick="document.getElementById('fileImport').click()">📥 Restaurer</button>
        <input type="file" id="fileImport" style="display: none;" onchange="importBackup(this)">
    </div>

    <nav class="navbar">
        <button class="nav-item active" onclick="nav('home', this)"><span>🏠</span>Accueil</button>
        <button class="nav-item" onclick="nav('add', this)"><span>➕</span>Ajout</button>
        <button class="nav-item" onclick="nav('stats', this)"><span>📊</span>Analyse</button>
        <button class="nav-item" onclick="nav('settings', this)"><span>⚙️</span>Options</button>
    </nav>

    <script>
        let db = JSON.parse(localStorage.getItem('budgetV7Dark')) || [];
        const colors = { 'Alimentation':'#ff7675', 'Loyer':'#d63031', 'Loisirs':'#a29bfe', 'Transport':'#0984e3', 'Shopping':'#fdcb6e', 'Scolarité':'#00cec9', 'Autre':'#b2bec3' };

        function nav(p,b){ 
            document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
            document.getElementById('page-'+p).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
            if(b)b.classList.add('active');
            if(p==='add'){ document.getElementById('inputDate').valueAsDate=new Date(); document.getElementById('monthSelCont').style.display='none'; }
            else { document.getElementById('monthSelCont').style.display='block'; updateUI(); }
            window.scrollTo(0,0);
        }

        function save(){ localStorage.setItem('budgetV7Dark',JSON.stringify(db)); initMonthSelector(); updateUI(); }
        function addTransaction(){
            const date=document.getElementById('inputDate').value, desc=document.getElementById('inputDesc').value, cat=document.getElementById('inputCat').value, amount=parseFloat(document.getElementById('inputAmount').value), type=document.getElementById('inputType').value;
            if(!date||!desc||!amount){alert("Tout remplir svp");return;}
            db.push({id:Date.now(),date,desc,cat,amount,type}); save();
            document.getElementById('inputDesc').value=''; document.getElementById('inputAmount').value='';
            nav('home', document.querySelectorAll('.nav-item')[0]);
        }
        function remove(id){ if(confirm('Supprimer ?')){ db=db.filter(t=>t.id!==id); save(); } }
        function getMonth(d){ return d.substring(0,7); }
        function initMonthSelector(){
            const s=document.getElementById('monthSelector'), c=s.value, m=[...new Set(db.map(t=>getMonth(t.date)))].sort().reverse(), t=getMonth(new Date().toISOString());
            if(!m.includes(t))m.unshift(t);
            s.innerHTML=m.map(x=>`<option value="${x}">${x}</option>`).join('');
            if(m.includes(c)&&c)s.value=c;
        }
        function updateUI(){
            const s=document.getElementById('monthSelector').value, d=db.filter(t=>getMonth(t.date)===s).sort((a,b)=>new Date(b.date)-new Date(a.date));
            let i=0,e=0,l=document.getElementById('list'); l.innerHTML='';
            d.forEach(t=>{ if(t.type==='income')i+=t.amount; else e+=t.amount; 
                l.innerHTML+=`<li class="trans-item type-${t.type}"><div style="flex:1"><div class="trans-desc">${t.desc}</div><div class="trans-meta">${t.cat}</div></div><div class="trans-amount" style="color:${t.type==='income'?'var(--green)':'var(--red)'}">${t.type==='income'?'+':'-'}${t.amount.toFixed(2)}€ <span onclick="remove(${t.id})" style="color:#aaa;margin-left:10px;cursor:pointer">x</span></div></li>`;
            });
            document.getElementById('displayIncome').innerText=`+${i.toFixed(0)}€`; document.getElementById('displayExpense').innerText=`-${e.toFixed(0)}€`; document.getElementById('displayBalance').innerText=`${(i-e).toFixed(2)}€`;
            document.getElementById('emptyMsg').style.display=d.length?'none':'block';
            drawChart(d,e);
        }
        function drawChart(d,e){
            if(e<=0){document.getElementById('chart').style.background='#383848';document.getElementById('legend').innerHTML='';return;}
            let c={},g=[],s=0,html=''; d.filter(t=>t.type==='expense').forEach(t=>c[t.cat]=(c[t.cat]||0)+t.amount);
            Object.keys(c).sort((a,b)=>c[b]-c[a]).forEach(k=>{ let p=(c[k]/e)*100,cl=colors[k]||'#999'; g.push(`${cl} ${s}% ${s+p}%`); html+=`<div class="legend-item" style="display:flex;justify-content:space-between;border-bottom:1px solid #ffffff10;padding:5px 0"><span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${cl};margin-right:10px"></span>${k}</span><span>${p.toFixed(0)}%</span></div>`; s+=p; });
            document.getElementById('chart').style.background=`conic-gradient(${g.join(', ')})`; document.getElementById('legend').innerHTML=html;
        }
        function exportCSV(){ let c="Date;Quoi;Montant\n";db.forEach(t=>c+=`${t.date};${t.desc};${t.amount}\n`);const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURI(c);a.download="b.csv";a.click(); }
        function downloadBackup(){ const a=document.createElement("a");a.href="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(db));a.download="backup.json";a.click(); }
        function importBackup(i){ const r=new FileReader(); r.onload=e=>{db=JSON.parse(e.target.result);save();alert("Ok");};r.readAsText(i.files[0]); }

        initMonthSelector(); updateUI(); nav('home',document.querySelectorAll('.nav-item')[0]);
    </script>
</body>
</html>
